<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 24th Anniversary Sherien & Sherif ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f0b18 0%, #3d122e 50%, #12050e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            color: white;
        }

        /* --- BACKGROUND AUDIO ELEMENT --- */
        #bgMusic { display: none; }

        /* --- ANIMATED MUSIC BAR GRAPH WIDGET (PLAY / PAUSE) --- */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 500;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .music-player.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .music-player:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }
        .bar {
            width: 3px;
            background: #ffd700;
            border-radius: 2px;
            height: 4px;
        }
        .music-player.playing .bar:nth-child(1) { animation: bounceBar 0.5s infinite alternate; }
        .music-player.playing .bar:nth-child(2) { animation: bounceBar 0.3s infinite alternate; }
        .music-player.playing .bar:nth-child(3) { animation: bounceBar 0.6s infinite alternate; }
        .music-player.playing .bar:nth-child(4) { animation: bounceBar 0.4s infinite alternate; }

        @keyframes bounceBar {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        /* --- ULTRA-SMOOTH CANVAS STARFIELD --- */
        #starCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- FRONT WELCOME SCREEN --- */
        .welcome-screen {
            position: absolute;
            width: 90vw; max-width: 480px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.35);
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .welcome-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .anniversary-title {
            font-size: clamp(22px, 3.5vw, 32px);
            color: #ffd700;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(255, 215, 0, 0.5);
            letter-spacing: 1px;
        }

        .couple-names {
            font-size: clamp(30px, 4.5vw, 42px);
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        /* Pulsing Heart Button */
        .heart-btn {
            background: linear-gradient(135deg, #ff4081, #ad1457);
            border: none;
            width: 85px; height: 85px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 64, 129, 0.6);
            animation: pulseHeart 1.5s infinite;
            transition: transform 0.2s ease;
        }

        .heart-btn:hover { transform: scale(1.12); }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 64, 129, 0.6); }
            50% { transform: scale(1.15); box-shadow: 0 0 45px rgba(255, 64, 129, 0.9); }
        }

        .tap-hint {
            margin-top: 20px;
            font-size: 13px;
            letter-spacing: 3px;
            color: #f8bbd0;
            text-transform: uppercase;
        }

        /* --- MAIN CELEBRATION CONTENT --- */
        .main-content {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease 0.3s;
            z-index: 10;
        }

        .main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .main-header {
            text-align: center;
            margin-top: 5px;
        }

        .main-header h1 {
            font-size: clamp(24px, 4vw, 40px);
            color: #ffd700;
            text-shadow: 0 3px 15px rgba(255, 215, 0, 0.5);
            font-style: italic;
            letter-spacing: 1px;
        }

        .main-header p {
            font-size: 13px;
            color: #fce4ec;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        /* --- BOUQUET & DANGLING FLOWER STEM STRUCTURE --- */
        .bouquet-container {
            position: relative;
            width: 700px;
            height: 500px;
            margin: auto;
            transform-origin: center center;
        }

        /* Stem lines connecting bouquet elements */
        .stem-line {
            position: absolute;
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            width: 3px;
            border-radius: 2px;
            z-index: 2;
        }

        /* Dangling Photo Flower Wrappers */
        .photo-wrapper {
            position: absolute;
            width: 80px; height: 100px;
            z-index: 10;
            transform-origin: top center;
        }

        .stem {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 3px; height: 20px; background: #2e7d32; border-radius: 2px; z-index: 11;
        }

        .dangler {
            position: absolute; top: 18px; left: 0; width: 80px; height: 80px;
            transform-origin: top center; animation: swing 3.5s ease-in-out infinite alternate;
            cursor: pointer; will-change: transform;
        }

        @keyframes swing { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }

        .img-box {
            width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
            border: 3px solid #ffd700; box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .dangler:hover .img-box { transform: scale(1.3); box-shadow: 0 15px 35px rgba(255, 64, 129, 0.8); border-color: #ff4081; }
        .photo-wrapper:hover { z-index: 100; }

        /* Bouquet Wrap / Ribbon Base at the bottom */
        .bouquet-wrap-base {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 70px;
            background: linear-gradient(135deg, #e91e63, #880e4f);
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 15;
            border: 2px solid #ffd700;
        }
        .bouquet-wrap-base span { font-size: 26px; }

        /* Coordinates for all 18 photos (`photo2.jpg` to `photo19.jpg`) in bouquet arrangement */
        .p2  { top: 40px; left: 310px; }
        .p3  { top: 60px; left: 220px; }
        .p4  { top: 60px; left: 400px; }
        .p5  { top: 120px; left: 140px; }
        .p6  { top: 120px; left: 480px; }
        .p7  { top: 100px; left: 265px; }
        .p8  { top: 100px; left: 355px; }
        .p9  { top: 160px; left: 200px; }
        .p10 { top: 160px; left: 420px; }
        .p11 { top: 180px; left: 310px; }
        .p12 { top: 220px; left: 120px; }
        .p13 { top: 220px; left: 500px; }
        .p14 { top: 240px; left: 230px; }
        .p15 { top: 240px; left: 390px; }
        .p16 { top: 290px; left: 170px; }
        .p17 { top: 290px; left: 450px; }
        .p18 { top: 310px; left: 310px; }
        .p19 { top: 350px; left: 310px; }

        /* Mobile Responsive Scaling */
        @media (max-width: 750px) {
            .bouquet-container { transform: scale(0.62); margin: -40px 0; }
        }

        /* --- QR CODE FOOTER SECTION (CLICKABLE) --- */
        .qr-section {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 2px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .qr-section:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.02);
        }

        .qr-code-box {
            width: 48px; height: 48px;
            background: white;
            padding: 3px;
            border-radius: 6px;
        }

        .qr-code-box img { width: 100%; height: 100%; }

        .qr-text h4 { font-size: 13px; color: #ffd700; }
        .qr-text p { font-size: 11px; color: #fce4ec; }

        /* --- LIGHTBOX & QR MODAL --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lightbox img {
            max-width: 85vw; max-height: 85vh; border-radius: 20px; border: 4px solid #ffd700;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .lightbox.active img { transform: scale(1); }

        .qr-modal-card {
            background: rgba(40, 15, 30, 0.95);
            padding: 30px;
            border-radius: 25px;
            border: 3px solid #ffd700;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.9);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
        }
        .lightbox.active .qr-modal-card { transform: scale(1); }
        .qr-modal-card img {
            width: 220px; height: 220px; border-radius: 10px; border: 3px solid white; margin-bottom: 15px;
        }
        .qr-modal-card p {
            color: #ffd700; font-size: 15px; margin-bottom: 15px; font-weight: bold;
        }

        .close-hint {
            position: absolute; bottom: 30px; color: #ffd700; font-size: 13px; letter-spacing: 2px;
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- Background Audio File -->
    <audio id="bgMusic" src="audio.mp3" loop></audio>

    <!-- Animated Music Bar Graph Widget (Top Right) -->
    <div class="music-player" id="musicPlayer" onclick="toggleAudio()">
        <div class="bars" id="audioBars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <span id="musicLabel">Playing Music</span>
    </div>

    <!-- Ultra-Smooth Canvas Starfield Background -->
    <canvas id="starCanvas"></canvas>

    <!-- FRONT WELCOME SCREEN -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="anniversary-title">Happy 24th Anniversary</div>
        <div class="couple-names">Sherien & Sherif</div>
        <button class="heart-btn" onclick="startCelebration()">❤️</button>
        <div class="tap-hint">Tap the heart to enter</div>
    </div>

    <!-- MAIN CELEBRATION CONTENT -->
    <div class="main-content" id="mainContent">
        <div class="main-header">
            <h1>Sherien & Sherif ❤️</h1>
            <p>24 Years of Blooming Love & Memories</p>
        </div>

        <!-- Dangling Flower Bouquet Structure (Photos 2 to 19) -->
        <div class="bouquet-container">
            <!-- Dangling Flower Photo Nodes -->
            <div class="photo-wrapper p2"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: 0s;"><div class="img-box"><img src="images/photo2.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p3"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.5s;"><div class="img-box"><img src="images/photo3.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p4"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1s;"><div class="img-box"><img src="images/photo4.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p5"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.5s;"><div class="img-box"><img src="images/photo5.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p6"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -2s;"><div class="img-box"><img src="images/photo6.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p7"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.3s;"><div class="img-box"><img src="images/photo7.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p8"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.2s;"><div class="img-box"><img src="images/photo8.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p9"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.7s;"><div class="img-box"><img src="images/photo9.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p10"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.8s;"><div class="img-box"><img src="images/photo10.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p11"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.4s;"><div class="img-box"><img src="images/photo11.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p12"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.1s;"><div class="img-box"><img src="images/photo12.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p13"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.6s;"><div class="img-box"><img src="images/photo13.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p14"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.4s;"><div class="img-box"><img src="images/photo14.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p15"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.2s;"><div class="img-box"><img src="images/photo15.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p16"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.6s;"><div class="img-box"><img src="images/photo16.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p17"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.9s;"><div class="img-box"><img src="images/photo17.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p18"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -1.3s;"><div class="img-box"><img src="images/photo18.jpg" alt="Memory"></div></div></div>
            <div class="photo-wrapper p19"><div class="stem"></div><div class="dangler" onclick="openPhoto(this)" style="animation-delay: -0.5s;"><div class="img-box"><img src="images/photo19.jpg" alt="Memory"></div></div></div>

            <!-- Bouquet Ribbon Wrap at Bottom -->
            <div class="bouquet-wrap-base">
                <span>🎀</span>
            </div>
        </div>

        <!-- Scannable QR Code Section (Clickable to Enlarge) -->
        <div class="qr-section" onclick="openQRModal()" title="Click to enlarge QR code">
            <div class="qr-code-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tamimfahmy.github.io/SH-/" alt="Scan QR Code">
            </div>
            <div class="qr-text">
                <h4>Scan to Revisit 🔍</h4>
                <p>Tap here to enlarge QR code!</p>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal for Photos -->
    <div class="lightbox" id="lightbox" onclick="closePhoto()">
        <img id="lightboxImg" src="" alt="Zoomed Photo">
        <div class="close-hint">Tap anywhere to close</div>
    </div>

    <!-- Enlarged QR Code Modal -->
    <div class="lightbox" id="qrModal" onclick="closeQRModal()">
        <div class="qr-modal-card" onclick="event.stopPropagation()">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://tamimfahmy.github.io/SH-/" alt="Enlarged QR Code">
            <p>Scan with any phone camera ❤️</p>
            <button onclick="closeQRModal()" style="background: #e91e63; color: white; border: none; padding: 8px 22px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: 'Georgia', serif;">Close</button>
        </div>
    </div>

    <script>
        // --- 60 FPS BUTTER-SMOOTH CANVAS STARFIELD ---
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        for (let i = 0; i < 55; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2 + 0.8,
                speed: Math.random() * 0.35 + 0.15,
                opacity: Math.random(),
                opacitySpeed: Math.random() * 0.015 + 0.005
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let star of stars) {
                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }

                star.opacity += star.opacitySpeed;
                if (star.opacity > 1 || star.opacity < 0.15) {
                    star.opacitySpeed = -star.opacitySpeed;
                }

                ctx.fillStyle = `rgba(255, 215, 0, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- AUDIO & WIDGET CONTROLS ---
        const audio = document.getElementById('bgMusic');
        const musicPlayer = document.getElementById('musicPlayer');
        const musicLabel = document.getElementById('musicLabel');

        function startCelebration() {
            audio.play().then(() => {
                musicPlayer.classList.add('playing');
                musicLabel.innerText = "Playing Music";
            }).catch(error => {
                console.log("Audio autoplay prevented or file missing:", error);
            });

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('visible');
            musicPlayer.classList.add('visible'); 
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicPlayer.classList.add('playing');
                musicLabel.innerText = "Playing Music";
            } else {
                audio.pause();
                musicPlayer.classList.remove('playing');
                musicLabel.innerText = "Paused";
            }
        }

        // --- LIGHTBOX & PHOTO CONTROLS ---
        function openPhoto(element) {
            const img = element.querySelector('img');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = img.src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closePhoto() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // --- ENLARGED QR CODE MODAL CONTROLS ---
        function openQRModal() {
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }
    </script>
</body>
</html>
