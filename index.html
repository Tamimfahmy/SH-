<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 24th Anniversary Sherien & Sherif ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #12050e 0%, #2c1622 50%, #1a0d14 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            color: white;
        }

        /* --- BACKGROUND AUDIO ELEMENT --- */
        #bgMusic { display: none; }

        /* --- ANIMATED MUSIC BAR GRAPH WIDGET (TOP RIGHT) --- */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 600;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.2s;
            opacity: 0;
            pointer-events: none;
            will-change: transform;
        }
        .music-player.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .music-player:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }
        .bar {
            width: 3px;
            background: #ffd700;
            border-radius: 2px;
            height: 4px;
        }
        .music-player.playing .bar:nth-child(1) { animation: bounceBar 0.5s infinite alternate; }
        .music-player.playing .bar:nth-child(2) { animation: bounceBar 0.3s infinite alternate; }
        .music-player.playing .bar:nth-child(3) { animation: bounceBar 0.6s infinite alternate; }
        .music-player.playing .bar:nth-child(4) { animation: bounceBar 0.4s infinite alternate; }

        @keyframes bounceBar {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        /* --- 60 FPS CANVAS STARFIELD --- */
        #starCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- WELCOME SCREEN --- */
        .welcome-screen {
            position: absolute;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s ease, transform 0.5s ease;
            cursor: pointer;
            will-change: transform, opacity;
        }

        .welcome-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .tap-title {
            font-size: clamp(22px, 4vw, 34px);
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 25px;
            text-shadow: 0 2px 15px rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
        }

        .heart-pulse-btn {
            font-size: 85px;
            animation: pulseHeart 1.2s infinite;
            filter: drop-shadow(0 0 25px rgba(233, 30, 99, 0.8));
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* --- MAIN CELEBRATION SCENE --- */
        .main-scene {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease 0.2s;
            z-index: 10;
        }

        .main-scene.bloomed {
            opacity: 1;
            pointer-events: auto;
        }

        .scene-title {
            position: absolute;
            top: 15px;
            font-size: clamp(22px, 3.8vw, 34px);
            color: #ffd700;
            font-style: italic;
            text-shadow: 0 3px 15px rgba(255, 215, 0, 0.6);
            letter-spacing: 1px;
            z-index: 30;
        }

        /* --- BOUQUET & ORGANIC PINK STEM STRUCTURE --- */
        .bouquet-container {
            position: relative;
            width: 460px;
            height: 440px;
            margin-top: 20px;
            animation: bloomBouquet 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform;
        }

        @keyframes bloomBouquet {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Thick, organic pinkish stems emerging from the bouquet wrap */
        .bouquet-stems {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Photo Flower Heads */
        .flower-photo {
            position: absolute;
            width: 62px; height: 62px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffd700;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), 0 0 12px rgba(255, 64, 129, 0.6);
            cursor: pointer;
            transition: transform 0.25s ease;
            z-index: 25;
            will-change: transform;
        }

        .flower-photo:hover {
            transform: scale(1.35);
            border-color: #ff4081;
            z-index: 100;
        }

        .flower-photo img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* Covered Roots / Bouquet Wrapper Cone */
        .bouquet-cone {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px; height: 150px;
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            z-index: 15;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .bouquet-ribbon {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 34px;
            z-index: 20;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }

        /* --- LETTER TOGGLE BUTTON & MODAL CARD --- */
        .letter-toggle-btn {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #e91e63, #ad1457);
            color: white;
            border: 2px solid #ffd700;
            padding: 9px 22px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .letter-toggle-btn:hover { transform: translateX(-50%) scale(1.05); }

        .letter-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }
        .letter-modal.active { opacity: 1; pointer-events: auto; }

        .letter-card-content {
            background: rgba(255, 255, 255, 0.96);
            color: #4a1535;
            padding: 30px;
            border-radius: 25px;
            width: 90%; max-width: 380px;
            text-align: center;
            border: 3px solid #ffd700;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .letter-modal.active .letter-card-content { transform: scale(1); }
        .letter-card-content h3 { font-size: 22px; color: #880e4f; margin-bottom: 10px; font-style: italic; }
        .letter-card-content p { font-size: 14px; line-height: 1.6; color: #5c1d39; margin-bottom: 15px; }

        /* --- SCANNABLE QR CODE FOOTER --- */
        .qr-section {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            cursor: pointer;
            z-index: 500;
            transition: transform 0.2s, background 0.2s;
        }
        .qr-section:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.03); }
        .qr-code-box { width: 40px; height: 40px; background: white; padding: 2px; border-radius: 5px; }
        .qr-code-box img { width: 100%; height: 100%; }
        .qr-text h4 { font-size: 11px; color: #ffd700; }
        .qr-text p { font-size: 10px; color: #fce4ec; }

        /* --- LIGHTBOX & QR MODAL --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img {
            max-width: 85vw; max-height: 85vh; border-radius: 20px; border: 4px solid #ffd700;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .lightbox.active img { transform: scale(1); }

        .qr-modal-card {
            background: rgba(40, 15, 30, 0.95);
            padding: 30px;
            border-radius: 25px;
            border: 3px solid #ffd700;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0,0,0,0.9);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 320px;
        }
        .lightbox.active .qr-modal-card { transform: scale(1); }
        .qr-modal-card img { width: 220px; height: 220px; border-radius: 10px; border: 3px solid white; margin-bottom: 15px; }
        .qr-modal-card p { color: #ffd700; font-size: 15px; margin-bottom: 15px; font-weight: bold; }

        .close-hint {
            position: absolute; bottom: 30px; color: #ffd700; font-size: 13px; letter-spacing: 2px;
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px;
        }

        @media (max-width: 600px) {
            .bouquet-container { transform: scale(0.72); margin-top: 5px; }
        }
    </style>
</head>
<body>

    <!-- Background Audio File -->

    <!-- Animated Music Bar Graph Widget (Top Right) -->

        <div class="bars" id="audioBars">
            <div class="bar"></div>

    <!-- 60 FPS Canvas Starfield -->

    <!-- WELCOME SCREEN -->

            <!-- 18 Photo Flower Heads (`photo2.jpg` to `photo19.jpg`) -->

            <div class="flower-photo" style="top: 100px; left: 294px;" onclick="openPhoto(this)"><img src="images/photo8.jpg" alt="Memory"></div>

            <div class="flower-photo" style="top: 145px; left: 384px;" onclick="openPhoto(this)"><img src="images/photo10.jpg" alt="Memory"></div>
            <div class="flower-photo" style="top: 140px; left: 154px;" onclick="openPhoto(this)"><img src="images/photo11.jpg" alt="Memory"></div>
            
            <div class="flower-photo" style="top: 140px; left: 286px;" onclick="openPhoto(this)"><img src="images/photo12.jpg" alt="Memory"></div>
            <div class="flower-photo" style="top: 180px; left: 74px;" onclick="openPhoto(this)"><img src="images/photo13.jpg" alt="Memory"></div>
            <div class="flower-photo" style="top: 180px; left: 346px;" onclick="openPhoto(this)"><img src="images/photo14.jpg" alt="Memory"></div>
            <div class="flower-photo" style="top: 195px; left: 181px;" onclick="openPhoto(this)"><img src="images/photo15.jpg" alt="Memory"></div>

            <div class="flower-photo" style="top: 215px; left: 256px;" onclick="openPhoto(this)"><img src="images/photo17.jpg" alt="Memory"></div>
            <div class="flower-photo" style="top: 240px; left: 181px;" onclick="openPhoto(this)"><img src="images/photo18.jpg" alt="Memory"></div>
            <div class="flower-photo" style="top: 280px; left: 181px;" onclick="openPhoto(this)"><img src="images/photo19.jpg" alt="Memory"></div>

            <!-- Covered Roots / Bouquet Cone & Ribbon -->
            <div class="bouquet-ribbon">🎀</div>
            <div class="bouquet-cone"></div>
        </div>

        <!-- Letter Toggle Button -->
        <button class="letter-toggle-btn" onclick="openLetterModal()">💌 Read Love Letter</button>

        <!-- Scannable QR Code Section -->
        <div class="qr-section" onclick="openQRModal()" title="Click to enlarge QR code">
            <div class="qr-code-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tamimfahmy.github.io/SH-/" alt="Scan QR Code">

    <!-- Love Letter Modal -->
    <div class="letter-modal" id="letterModal" onclick="closeLetterModal()">
        <div class="letter-card-content" onclick="event.stopPropagation()">
            <h3>Dear Sherien & Sherif</h3>
            <p>Happy late 24th anniversary! We wish you many more years filled with endless love, health, and beautiful memories together. ❤️</p>
            <button onclick="closeLetterModal()" style="background: #e91e63; color: white; border: none; padding: 8px 22px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: 'Georgia', serif;">Close</button>
        </div>
    </div>

    <!-- Lightbox Modal for Photos -->

        <img id="lightboxImg" src="" alt="Zoomed Photo">
        <div class="close-hint">Tap anywhere to close</div>
    </div>

    <!-- Enlarged QR Code Modal -->
    <div class="lightbox" id="qrModal" onclick="closeQRModal()">
        <div class="qr-modal-card" onclick="event.stopPropagation()">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://tamimfahmy.github.io/SH-/" alt="Enlarged QR Code">
            <p>Scan with any phone camera ❤️</p>
            <button onclick="closeQRModal()" style="background: #e91e63; color: white; border: none; padding: 8px 22px; border-radius: 20px; cursor: pointer; font-weight: bold; font-family: 'Georgia', serif;">Close</button>
        </div>
    </div>

    <script>
        // --- 60 FPS CANVAS STARFIELD ---
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.8,
                speed: Math.random() * 0.3 + 0.1,
                opacity: Math.random(),
                opacitySpeed: Math.random() * 0.01 + 0.004
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let star of stars) {
                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }

                star.opacity += star.opacitySpeed;
                if (star.opacity > 1 || star.opacity < 0.15) {
                    star.opacitySpeed = -star.opacitySpeed;
                }

                ctx.fillStyle = `rgba(255, 215, 0, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- AUDIO & WIDGET CONTROLS ---
        const audio = document.getElementById('bgMusic');
        const musicPlayer = document.getElementById('musicPlayer');
        const musicLabel = document.getElementById('musicLabel');

        function startCelebration() {
            audio.play().then(() => {
                musicPlayer.classList.add('playing');
                musicLabel.innerText = "Playing Music";
            }).catch(error => {
                console.log("Audio autoplay prevented or file missing:", error);
            });

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainScene').classList.add('bloomed');
            musicPlayer.classList.add('visible');
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicPlayer.classList.add('playing');
                musicLabel.innerText = "Playing Music";
            } else {
                audio.pause();
                musicPlayer.classList.remove('playing');
                musicLabel.innerText = "Paused";
            }
        }

        // --- LETTER MODAL CONTROLS ---
        function openLetterModal() {
            document.getElementById('letterModal').classList.add('active');
        }
        function closeLetterModal() {
            document.getElementById('letterModal').classList.remove('active');
        }

        // --- LIGHTBOX & PHOTO CONTROLS ---
        function openPhoto(element) {
            const img = element.querySelector('img');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = img.src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closePhoto() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // --- ENLARGED QR CODE MODAL CONTROLS ---
        function openQRModal() {
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.remove('active');
        }
    </script>
</body>
</html>
