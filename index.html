<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 24th Anniversary Sherien & Sherif ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1f0b18 0%, #3d122e 50%, #12050e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            color: white;
        }

        /* --- BACKGROUND AUDIO ELEMENT --- */
        #bgMusic { display: none; }

        /* --- ANIMATED MUSIC BAR GRAPH WIDGET (PLAY / PAUSE) --- */
        .music-player {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 500;
            color: #ffd700;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: background 0.2s, transform 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        .music-player.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .music-player:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

        .bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }
        .bar {
            width: 3px;
            background: #ffd700;
            border-radius: 2px;
            height: 4px;
        }
        .music-player.playing .bar:nth-child(1) { animation: bounceBar 0.5s infinite alternate; }
        .music-player.playing .bar:nth-child(2) { animation: bounceBar 0.3s infinite alternate; }
        .music-player.playing .bar:nth-child(3) { animation: bounceBar 0.6s infinite alternate; }
        .music-player.playing .bar:nth-child(4) { animation: bounceBar 0.4s infinite alternate; }

        @keyframes bounceBar {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        /* --- ULTRA-SMOOTH CANVAS STARFIELD --- */
        #starCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* --- FRONT WELCOME SCREEN --- */
        .welcome-screen {
            position: absolute;
            width: 90vw; max-width: 480px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 215, 0, 0.35);
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
            transition: opacity 0.5s ease, transform 0.5s ease;
            will-change: transform, opacity;
        }

        .welcome-screen.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .anniversary-title {
            font-size: clamp(22px, 3.5vw, 32px);
            color: #ffd700;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(255, 215, 0, 0.5);
            letter-spacing: 1px;
        }

        .couple-names {
            font-size: clamp(30px, 4.5vw, 42px);
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
        }

        /* Pulsing Heart Button */
        .heart-btn {
            background: linear-gradient(135deg, #ff4081, #ad1457);
            border: none;
            width: 85px; height: 85px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 64, 129, 0.6);
            animation: pulseHeart 1.5s infinite;
            transition: transform 0.2s ease;
        }

        .heart-btn:hover { transform: scale(1.12); }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 64, 129, 0.6); }
            50% { transform: scale(1.15); box-shadow: 0 0 45px rgba(255, 64, 129, 0.9); }
        }

        .tap-hint {
            margin-top: 20px;
            font-size: 13px;
            letter-spacing: 3px;
            color: #f8bbd0;
            text-transform: uppercase;
        }

        /* --- MAIN CELEBRATION CONTENT --- */
        .main-content {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease 0.3s;
            z-index: 10;
        }

        .main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .main-header {
            text-align: center;
            margin-top: 5px;
        }

        .main-header h1 {
            font-size: clamp(26px, 4vw, 42px);
            color: #ffd700;
            text-shadow: 0 3px 15px rgba(255, 215, 0, 0.5);
            font-style: italic;
            letter-spacing: 1px;
        }

        .main-header p {
            font-size: 14px;
            color: #fce4ec;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* Photo Gallery Grid */
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            max-width: 880px;
            max-height: 54vh;
            overflow-y: auto;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,215,0,0.3) transparent;
        }

        .photo-card {
            width: 100px; height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #ffd700;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInPhoto 0.6s ease backwards;
            will-change: transform;
        }

        .photo-card:hover {
            transform: scale(1.16);
            border-color: #ff4081;
            z-index: 50;
        }

        .photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        @keyframes fadeInPhoto {
            from { opacity: 0; transform: scale(0.2); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- QR CODE FOOTER SECTION --- */
        .qr-section {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 5px;
        }

        .qr-code-box {
            width: 55px; height: 55px;
            background: white;
            padding: 3px;
            border-radius: 6px;
        }

        .qr-code-box img { width: 100%; height: 100%; }

        .qr-text h4 { font-size: 13px; color: #ffd700; }
        .qr-text p { font-size: 11px; color: #fce4ec; }

        /* --- LIGHTBOX MODAL --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 1000;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img {
            max-width: 85vw; max-height: 85vh; border-radius: 20px; border: 4px solid #ffd700;
            box-shadow: 0 25px 70px rgba(0,0,0,0.8);
            transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .lightbox.active img { transform: scale(1); }
        .close-hint {
            position: absolute; bottom: 30px; color: #ffd700; font-size: 13px; letter-spacing: 2px;
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px;
        }
    </style>
</head>
<body>

    <!-- Background Audio File -->
    <audio id="bgMusic" src="audio.mp3" loop></audio>

    <!-- Animated Music Bar Graph Widget (Top Right) -->
    <div class="music-player" id="musicPlayer" onclick="toggleAudio()">
        <div class="bars" id="audioBars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <span id="musicLabel">Playing Music</span>
    </div>

    <!-- Ultra-Smooth Canvas Starfield Background -->
    <canvas id="starCanvas"></canvas>

    <!-- FRONT WELCOME SCREEN -->
    <div class="welcome-screen" id="welcomeScreen">
        <div class="anniversary-title">Happy 24th Anniversary</div>
        <div class="couple-names">Sherien & Sherif</div>
        <button class="heart-btn" onclick="startCelebration()">❤️</button>
        <div class="tap-hint">Tap the heart to enter</div>
    </div>

    <!-- MAIN CELEBRATION CONTENT -->
    <div class="main-content" id="mainContent">
        <div class="main-header">
            <h1>Sherien & Sherif ❤️</h1>
            <p>24 Years of Love & Beautiful Memories</p>
        </div>

        <!-- Photo Gallery Grid (Photos 2 to 19) -->
        <div class="photo-grid">
            <div class="photo-card" style="animation-delay: 0.05s;" onclick="openPhoto(this)"><img src="images/photo2.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.1s;" onclick="openPhoto(this)"><img src="images/photo3.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.15s;" onclick="openPhoto(this)"><img src="images/photo4.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.2s;" onclick="openPhoto(this)"><img src="images/photo5.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.25s;" onclick="openPhoto(this)"><img src="images/photo6.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.3s;" onclick="openPhoto(this)"><img src="images/photo7.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.35s;" onclick="openPhoto(this)"><img src="images/photo8.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.4s;" onclick="openPhoto(this)"><img src="images/photo9.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.45s;" onclick="openPhoto(this)"><img src="images/photo10.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.5s;" onclick="openPhoto(this)"><img src="images/photo11.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.55s;" onclick="openPhoto(this)"><img src="images/photo12.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.6s;" onclick="openPhoto(this)"><img src="images/photo13.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.65s;" onclick="openPhoto(this)"><img src="images/photo14.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.7s;" onclick="openPhoto(this)"><img src="images/photo15.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.75s;" onclick="openPhoto(this)"><img src="images/photo16.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.8s;" onclick="openPhoto(this)"><img src="images/photo17.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.85s;" onclick="openPhoto(this)"><img src="images/photo18.jpg" alt="Memory"></div>
            <div class="photo-card" style="animation-delay: 0.9s;" onclick="openPhoto(this)"><img src="images/photo19.jpg" alt="Memory"></div>
        </div>

        <!-- Scannable QR Code Section -->
        <div class="qr-section">
            <div class="qr-code-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tamimfahmy.github.io/SH-/" alt="Scan QR Code">
            </div>
            <div class="qr-text">
                <h4>Scan to Revisit</h4>
                <p>Point your phone camera here anytime!</p>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal for Photos -->
    <div class="lightbox" id="lightbox" onclick="closePhoto()">
        <img id="lightboxImg" src="" alt="Zoomed Photo">
        <div class="close-hint">Tap anywhere to close</div>
    </div>

    <script>
        // --- 60 FPS BUTTER-SMOOTH CANVAS STARFIELD ---
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = [];
        for (let i = 0; i < 55; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2 + 0.8,
                speed: Math.random() * 0.35 + 0.15,
                opacity: Math.random(),
                opacitySpeed: Math.random() * 0.015 + 0.005
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let star of stars) {
                star.y -= star.speed;
                if (star.y < 0) {
                    star.y = canvas.height;
                    star.x = Math.random() * canvas.width;
                }

                star.opacity += star.opacitySpeed;
                if (star.opacity > 1 || star.opacity < 0.15) {
                    star.opacitySpeed = -star.opacitySpeed;
                }

                ctx.fillStyle = `rgba(255, 215, 0, ${star.opacity})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- AUDIO & WIDGET CONTROLS ---
        const audio = document.getElementById('bgMusic');
        const musicPlayer = document.getElementById('musicPlayer');
        const musicLabel = document.getElementById('musicLabel');

        function startCelebration() {
            audio.play().then(() => {
                musicPlayer.classList.add('playing');
                musicLabel.innerText = "Playing Music";
            }).catch(error => {
                console.log("Audio autoplay prevented or file missing:", error);
            });

            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('visible');
            musicPlayer.classList.add('visible'); 
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                musicPlayer.classList.add('playing');
                musicLabel.innerText = "Playing Music";
            } else {
                audio.pause();
                musicPlayer.classList.remove('playing');
                musicLabel.innerText = "Paused";
            }
        }

        // --- LIGHTBOX CONTROLS ---
        function openPhoto(element) {
            const img = element.querySelector('img');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = img.src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closePhoto() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>
</body>
</html>
